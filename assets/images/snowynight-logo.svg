<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 232 208"
  width="232"
  height="208"
>
  <defs>

    <!-- 左侧：浅蓝 -->
    <linearGradient
      id="leftGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#5CCBFA"/>
      <stop offset="100%" stop-color="#72B9F5"/>
    </linearGradient>

    <!-- 中间：稍深蓝 -->
    <linearGradient
      id="centerGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#5BA7F7"/>
      <stop offset="100%" stop-color="#668AF0"/>
    </linearGradient>

    <!-- 右侧：蓝 → 紫 -->
    <linearGradient
      id="rightGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#648AF3"/>
      <stop offset="100%" stop-color="#9A6DEB"/>
    </linearGradient>

    <!-- 中心圆 -->
    <radialGradient id="centerDot">
      <stop offset="0%" stop-color="#6CA4F5"/>
      <stop offset="100%" stop-color="#6888EE"/>
    </radialGradient>

    <!--
      基准花瓣
      特意把尖端做成圆润的水滴形，
      而不是尖角。
    -->
    <path
      id="petal"
      d="
        M 116 24

        C 120 26, 124 33, 127 41
        C 130 49, 131 57, 129 64

        C 127 74, 121 82, 116 87

        C 111 82, 105 74, 103 64

        C 101 57, 102 49, 105 41
        C 108 33, 112 26, 116 24

        Z
      "
    />

  </defs>


  <!-- ==================================================
       六片雪花花瓣
       ================================================== -->

  <!-- 左上：浅蓝 -->
  <use
    href="#petal"
    fill="url(#leftGradient)"
    transform="rotate(-60 116 104)"
  />

  <!-- 左下：浅蓝 -->
  <use
    href="#petal"
    fill="url(#leftGradient)"
    transform="rotate(-120 116 104)"
  />


  <!-- 上方：稍深蓝 -->
  <use
    href="#petal"
    fill="url(#centerGradient)"
  />

  <!-- 下方：稍深蓝 -->
  <use
    href="#petal"
    fill="url(#centerGradient)"
    transform="rotate(180 116 104)"
  />


  <!-- 右上：蓝紫 -->
  <use
    href="#petal"
    fill="url(#rightGradient)"
    transform="rotate(60 116 104)"
  />

  <!-- 右下：蓝紫 -->
  <use
    href="#petal"
    fill="url(#rightGradient)"
    transform="rotate(120 116 104)"
  />


  <!-- ==================================================
       中心圆
       ================================================== -->

  <circle
    cx="116"
    cy="104"
    r="10"
    fill="url(#centerDot)"
  />

</svg>