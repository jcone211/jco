{{- $baseURL := site.Params.dify.baseURL | default "http://localhost:8091" | strings.TrimSuffix "/" -}}
{{- $path := .Get "path" | default "" -}}
{{- $allow := .Get "allow" | default "microphone" -}}
<div class="agent-chat-frame">
  <iframe
    src="{{ $baseURL }}/{{ $path }}"
    style="width: 100%; height: 100%; min-height: 700px"
    frameborder="0"
    allow="{{ $allow }}">
  </iframe>
</div>
