# nginx 代理配置 — 访客统计服务器
# 将此配置片段放入 nginx 站点配置的 server block 内。
# Python 服务器绑定 0.0.0.0:3001；如果 nginx 在 Docker 内，将 127.0.0.1 替换为 Docker 网关 IP
# （可通过 `docker inspect <容器> --format '{{.NetworkSettings.Networks.<网络>.Gateway}}'` 获取）。

location /api/track {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffer_size 4k;
    proxy_buffering off;
    client_max_body_size 4k;
}

location /visitor-statistics {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}